<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Day</title>
  <meta name="description" content="Today's NFL, NBA and European soccer fixtures with form, weather, lineups and injuries." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E11'/%3E%3Crect x='8' y='8' width='16' height='16' rx='3' fill='%23FFB703'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="title">Game Day</h1>
      <span id="daylabel" class="daylabel"></span>
      <nav class="datenav" aria-label="Date">
        <button id="prev" class="btn icon" aria-label="Previous day" title="Previous day">&#8249;</button>
        <button id="today" class="btn">Today</button>
        <button id="next" class="btn icon" aria-label="Next day" title="Next day">&#8250;</button>
        <input id="datepick" type="date" class="datepick" aria-label="Pick a date" />
        <span id="livedot" class="livedot hidden" title="Live updates connected: scores and clocks are pushed within seconds"><span class="dot" aria-hidden="true"></span>LIVE</span>
        <span id="updated" class="updated"></span>
        <button id="refresh" class="btn primary" title="Refresh now">Refresh</button>
      </nav>
    </div>
  </header>

  <div id="banner" class="banner hidden" role="status"></div>

  <main id="main">
    <div class="filter-row">
      <div class="tabs" id="sport-tabs" role="group" aria-label="Sport"></div>
      <div class="chips" id="league-filters" role="group" aria-label="Soccer leagues"></div>
    </div>
    <div id="groups"></div>
  </main>

  <footer class="foot">
    Scores, fixtures, lineups and injuries from ESPN. Weather from Open-Meteo at kickoff. Times shown in your local timezone.
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close btn icon" data-close aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="kalshi.js"></script>
  <script src="whales.js"></script>
  <script src="app.js"></script>
</body>
</html>
